      const [startDate, setStartDate] = useState("2026-11-05");
      const [endDate, setEndDate] = useState("2026-11-08");
      const [basePrice, setBasePrice] = useState(100);
      const [weekendMultiplier, setWeekendMultiplier] = useState(1.4); // 40% surge

        el.value = text;
        document.body.appendChild(el);
        el.select();

        document.body.removeChild(el);

      // Simulator Logic for Hotel Dynamic Pricing Engine
      const pricingBreakdown = useMemo(() => {
        const start = new Date(startDate);
        const end = new Date(endDate);
        
        if (isNaN(start.getTime()) || isNaN(end.getTime()) || start >= end) {
          return { error: "Please select a valid check-in and check-out date range." };
        }

        let totalAmount = 0;
        let weekdayCount = 0;
        let weekendCount = 0;
        const details = [];

        let current = new Date(start);
        while (current < end) {
          const dayOfWeek = current.getDay(); // 0 = Sun, 4 = Thu, 5 = Fri
          // Weekend surge applied to Thursday (4) & Friday (5) as per Hotel API spec
          const isWeekend = (dayOfWeek === 4 || dayOfWeek === 5);
          const nightRate = isWeekend ? Math.round(basePrice * weekendMultiplier) : basePrice;

          if (isWeekend) weekendCount++;
          else weekdayCount++;

          totalAmount += nightRate;
          details.push({
            date: current.toISOString().split('T')[0],
            dayName: current.toLocaleDateString('en-US', { weekday: 'short' }),
            isWeekend,
            rate: nightRate
          });

          current.setDate(current.getDate() + 1);
        }

        return {
          totalAmount,
          totalNights: details.length,
          weekdayCount,
          weekendCount,
          details
        };

              {/* Controls Grid */}
              <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                <div class="space-y-1.5">
                  <label class="text-xs font-mono text-slate-300">Check-In Date</label>
                  <input 
                    type="date" 
                    value={startDate} 
                    onChange={(e) => setStartDate(e.target.value)}
                    class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm font-mono text-white focus:outline-none focus:border-emerald-500"
                  />
                </div>

                <div class="space-y-1.5">
                  <label class="text-xs font-mono text-slate-300">Check-Out Date</label>
                  <input 
                    type="date" 
                    value={endDate} 
                    onChange={(e) => setEndDate(e.target.value)}
                    class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm font-mono text-white focus:outline-none focus:border-emerald-500"
                  />
                </div>

                <div class="space-y-1.5">
                  <label class="text-xs font-mono text-slate-300">Weekday Base Price ($)</label>
                  <input 
                    type="number" 
                    min="50"
                    max="1000"
                    value={basePrice} 
                    onChange={(e) => setBasePrice(Number(e.target.value))}
                    class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm font-mono text-white focus:outline-none focus:border-emerald-500"
                  />
                </div>

                <div class="space-y-1.5">
                  <label class="text-xs font-mono text-slate-300">Weekend Surge Rate</label>
                  <select 
                    value={weekendMultiplier}
                    onChange={(e) => setWeekendMultiplier(Number(e.target.value))}
                    class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm font-mono text-white focus:outline-none focus:border-emerald-500">
                    <option value="1.2">1.2x (20% Surge)</option>
                    <option value="1.4">1.4x (40% Surge - Standard)</option>
                    <option value="1.5">1.5x (50% Peak Surge)</option>
                  </select>
                </div>
              </div>

              {/* Output Results */}
              {pricingBreakdown.error ? (
                <div class="p-4 bg-red-500/10 border border-red-500/30 text-red-400 text-sm rounded-xl font-mono">
                  {pricingBreakdown.error}
                </div>
              ) : (
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 pt-2">
                  
                  {/* Summary Box */}
                  <div class="bg-slate-950 border border-slate-800 rounded-2xl p-5 space-y-4 flex flex-col justify-between">
                    <div>
                      <div class="text-xs font-mono text-slate-400 uppercase mb-1">Calculated Stay Total</div>
                      <div class="text-4xl font-extrabold text-white">
                        ${pricingBreakdown.totalAmount}
                      </div>
                      <div class="text-xs font-mono text-slate-400 mt-2">
                        {pricingBreakdown.totalNights} Night(s) Stay
                      </div>
                    </div>

                    <div class="space-y-2 border-t border-slate-800 pt-3 text-xs font-mono">
                      <div class="flex justify-between">
                        <span class="text-slate-400">Regular Nights:</span>
                        <span class="text-slate-200">{pricingBreakdown.weekdayCount} × ${basePrice}</span>
                      </div>
                      <div class="flex justify-between">
                        <span class="text-emerald-400">Weekend Nights (Thu/Fri):</span>
                        <span class="text-emerald-400">{pricingBreakdown.weekendCount} × ${Math.round(basePrice * weekendMultiplier)}</span>
                      </div>
                    </div>
                  </div>

                  {/* Nightly Breakdown Table */}
                  <div class="md:col-span-2 bg-slate-950 border border-slate-800 rounded-2xl p-4 overflow-hidden">
                    <div class="text-xs font-mono text-slate-400 uppercase mb-3 px-2">Nightly Calculation Trace</div>
                    <div class="max-h-48 overflow-y-auto space-y-2 pr-1">
                      {pricingBreakdown.details.map((item, idx) => (
                        <div 
                          key={idx} 
                          class={`flex items-center justify-between p-2.5 rounded-xl font-mono text-xs ${
                            item.isWeekend 
                              ? 'bg-emerald-500/10 border border-emerald-500/30 text-emerald-300' 
                              : 'bg-slate-900 text-slate-300'
                          }`}>
                          <div class="flex items-center space-x-3">
                            <span class="font-bold">{item.date}</span>
                            <span class="text-slate-400">({item.dayName})</span>
                          </div>
                          <div class="flex items-center space-x-2">
                            {item.isWeekend && (
                              <span class="bg-emerald-500/20 text-emerald-400 px-2 py-0.5 rounded text-[10px] uppercase font-semibold">
                                Weekend Surge (+{Math.round((weekendMultiplier - 1) * 100)}%)
                              </span>
                            )}
                            <span class="font-bold text-white">${item.rate}</span>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>

                </div>
              )}
            </section>

            {/* 6. CONTACT & FREELANCE CTA */}
            <section id="contact" class="bg-slate-900/40 border border-slate-800 rounded-3xl p-8 md:p-12 text-center space-y-8 relative overflow-hidden">
              <div class="max-w-2xl mx-auto space-y-4">
                <span class="text-xs font-mono text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 px-3.5 py-1.5 rounded-full">
                  Let's Work Together
                </span>
                <h2 class="text-3xl md:text-4xl font-extrabold text-white tracking-tight">
                  Need a Bulletproof Backend for Your Project?
                </h2>
                <p class="text-slate-400 text-sm md:text-base leading-relaxed">
                  Whether you are building a new startup backend from scratch or need an experienced developer to architect scalable APIs with Node.js & TypeScript, I'm ready to collaborate.
                </p>
              </div>

              <div class="flex flex-wrap items-center justify-center gap-4 pt-2">
                <button 
                  onClick={() => copyToClipboard('7odmo333@gmail.com', 'Email address')}
                  class="bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold px-6 py-3.5 rounded-xl transition-all shadow-lg hover:shadow-emerald-500/20 flex items-center space-x-2">
                  <i data-lucide="mail" class="w-5 h-5"></i>
                  <span>Copy Email (7odmo333@gmail.com)</span>
                </button>

                <a 
                  href="https://github.com/mahmoudmohamedabdelmaksoud33-lab/hotel-management-api" 
                  target="_blank" 
                  rel="noopener noreferrer" 
                  class="bg-slate-900 border border-slate-700 hover:border-slate-500 text-slate-200 font-medium px-6 py-3.5 rounded-xl transition-all flex items-center space-x-2">
                  <i data-lucide="github" class="w-5 h-5"></i>
                  <span>GitHub Repository</span>
                </a>
              </div>
            </section>

          </main>

          {/* Footer */}
          <footer class="border-t border-slate-800/80 py-8 text-center text-xs font-mono text-slate-500">
            <div class="max-w-6xl mx-auto px-6 flex flex-col sm:flex-row items-center justify-between gap-4">
              <div>
                © 2026 Mahmoud Mohamed. Built with React & Tailwind CSS.
              </div>
              <div class="flex items-center space-x-4">
                <span class="text-emerald-400">Node.js</span>
                <span>•</span>
                <span class="text-emerald-400">TypeScript</span>
                <span>•</span>
                <span class="text-emerald-400">PostgreSQL</span>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    // Render App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
